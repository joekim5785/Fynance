{% extends "layout.html" %} {% block title %} change password {% endblock %} {%
block main %}

<form action="/change_password" method="post">
  <div class="form-group mb-4">
    <input
      type="password"
      class="form-control"
      name="current_password"
      autocomplete="off"
      autofocus
      placeholder="Enter Current password"
    />
  </div>
  <div class="form-group mb-4">
    <input
      type="password"
      class="form-control"
      autocomplete="off"
      name="new_password"
      placeholder="New Password"
    />
  </div>
  <div class="form-group mb-4">
    <input
      type="password"
      class="form-control"
      autocomplete="off"
      name="confirm_password"
      placeholder="Confirm Password"
    />
  </div>
  <button type="submit" class="btn btn-primary mb-4">Change password</button>
  <div class="form-group mb-4">
    <button
      type="submit"
      name="cancel"
      onclick="window.location.href = '/'"
      class="btn btn-danger"
    >
      Cancel
    </button>
  </div>
</form>
{% endblock %}
